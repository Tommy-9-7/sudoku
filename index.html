<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spiele</title>
  <style>
    :root {
      --bg:#fafaf7; --fg:#1d1d1b; --mut:#77756e; --line:#c9c6bb;
      --card:#fff; --acc:#1a5fd0; --soft:#edf2fa;
      box-sizing:border-box;
    }
    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg:#171716; --fg:#ecece6; --mut:#9a988f; --line:#4a4944;
        --card:#232321; --acc:#7db0ff; --soft:#2a2d33;
      }
    }
    :root[data-theme="dark"] {
      --bg:#171716; --fg:#ecece6; --mut:#9a988f; --line:#4a4944;
      --card:#232321; --acc:#7db0ff; --soft:#2a2d33;
    }
    html,body { min-height:100%; }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
      padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    }
    main { max-width:820px; margin:0 auto; padding:16px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    h1 { margin:0; font-size:26px; }
    button,input { font:inherit; color:inherit; }
    .name-link { border:0; background:none; color:var(--acc); cursor:pointer; padding:10px 4px; text-decoration:underline; }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .card {
      display:block; min-height:150px; box-sizing:border-box; padding:18px;
      border:1px solid var(--line); border-radius:16px; background:var(--card);
      color:var(--fg); text-decoration:none;
    }
    .card:hover,.card:focus-visible { border-color:var(--acc); outline:none; }
    .icon { display:grid; place-items:center; width:48px; height:48px; margin-bottom:12px;
      border-radius:12px; background:var(--soft); font-size:28px; }
    .card h2 { margin:0 0 4px; font-size:20px; }
    .card p { margin:0; color:var(--mut); }
    .card.disabled { cursor:not-allowed; opacity:.72; }
    .badge { display:inline-block; margin-top:10px; padding:4px 8px; border-radius:999px;
      background:var(--soft); color:var(--mut); font-size:13px; font-weight:700; }
    .overlay { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
      padding:16px; background:rgba(0,0,0,.65); box-sizing:border-box; }
    .modal { width:100%; max-width:380px; padding:16px; box-sizing:border-box;
      border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .modal h2 { margin:0 0 8px; }
    input { width:100%; box-sizing:border-box; padding:13px; border:1px solid var(--line);
      border-radius:10px; background:var(--bg); }
    .save { width:100%; min-height:48px; margin-top:8px; border:1px solid var(--acc);
      border-radius:10px; background:var(--acc); color:var(--bg); font-weight:700; cursor:pointer; }
    @media (max-width:520px) { .cards { grid-template-columns:1fr; } .card { min-height:130px; } }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1 id="greeting">Hallo</h1>
      <button class="name-link" id="changeName" type="button">Name ändern</button>
    </div>
    <div class="cards">
      <a class="card" href="sudoku.html">
        <div class="icon" aria-hidden="true">▦</div>
        <h2>Sudoku</h2>
        <p>Tägliche Rätsel und Bestenlisten</p>
      </a>
      <a class="card" href="runner.html">
        <div class="icon" aria-hidden="true">🚲</div>
        <h2>Dresden Runner</h2>
        <p>Springe durch Dresden und sammle Punkte</p>
      </a>
      <a class="card" id="memeCard" href="meme.html">
        <div class="icon" aria-hidden="true">🖼️</div>
        <h2>Tagesmeme</h2>
        <p>Ein Meme und deine Sätze des Tages</p>
      </a>
      <a class="card" href="beobachtung.html">
        <div class="icon" aria-hidden="true">🔭</div>
        <h2>Tagesbeobachtung</h2>
        <p>Eine tägliche kleine Entdeckung</p>
        <span class="badge">Bald verfügbar</span>
      </a>
    </div>
  </main>
  <script>
    const esc = s => String(s).replace(/[&<>"]/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"
    }[c]));
    let name = "";
    try { name = localStorage.getItem("sdk_name") || ""; } catch (_) {}

    function greeting() {
      document.getElementById("greeting").textContent = name ? "Hallo " + name : "Hallo";
    }

    function askName() {
      const overlay = document.createElement("div");
      overlay.className = "overlay";
      overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h2>Wie heißt du?</h2><input id="nm" maxlength="20" placeholder="Benutzername" autocomplete="off"><button class="save" id="saveName" type="button">Los geht’s</button></div>';
      document.body.appendChild(overlay);
      const input = document.getElementById("nm");
      input.focus();
      function save() {
        const value = input.value.trim();
        if (!value) return;
        name = value;
        try { localStorage.setItem("sdk_name", value); } catch (_) {}
        overlay.remove();
        greeting();
      }
      document.getElementById("saveName").addEventListener("click", save);
      input.addEventListener("keydown", event => { if (event.key === "Enter") save(); });
    }

    document.getElementById("changeName").addEventListener("click", askName);
    greeting();
    if (!name) askName();
  </script>
</body>
</html>
