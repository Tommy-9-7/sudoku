<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tagesmeme</title>
  <style>
    :root {
      --bg:#fafaf7; --fg:#1d1d1b; --mut:#77756e; --line:#c9c6bb;
      --card:#fff; --acc:#1a5fd0; --soft:#edf2fa; --err:#d33;
      box-sizing:border-box;
    }
    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg:#171716; --fg:#ecece6; --mut:#9a988f; --line:#4a4944;
        --card:#232321; --acc:#7db0ff; --soft:#2a2d33; --err:#ff6b6b;
      }
    }
    :root[data-theme="dark"] {
      --bg:#171716; --fg:#ecece6; --mut:#9a988f; --line:#4a4944;
      --card:#232321; --acc:#7db0ff; --soft:#2a2d33; --err:#ff6b6b;
    }
    html,body { min-height:100%; }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
      padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    }
    main { max-width:820px; margin:0 auto; padding:16px; }
    .start-link { display:inline-block; margin-bottom:10px; color:var(--acc); text-decoration:none; font-weight:600; }
    h1 { font-size:24px; margin:8px 0 12px; }
    .tabs { display:flex; gap:8px; margin:8px 0 16px; }
    .tabs button { flex:1; }
    .tabs button.on { border-color:var(--acc); background:var(--acc); color:white; }
    .hidden { display:none !important; }
    .daily-meme { display:block; width:100%; max-height:520px; object-fit:contain;
      border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .meme-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:12px; }
    @media (max-width:520px) { .meme-grid { grid-template-columns:1fr; } }
    .meme-card { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .meme-card img { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:#ddd; }
    .meme-card-text { padding:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .meme-card footer { display:flex; justify-content:space-between; gap:8px; padding:0 12px 12px; color:var(--mut); }
    .meme-card strong { color:var(--fg); overflow:hidden; text-overflow:ellipsis; }
    .meme-card time { white-space:nowrap; }
    .form { display:grid; gap:10px; margin-top:4px; }
    .form label { font-weight:700; }
    .form input[type="text"] { width:100%; box-sizing:border-box; padding:13px;
      border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); font:inherit; }
    textarea { width:100%; min-height:92px; resize:vertical; box-sizing:border-box;
      padding:12px; border:1px solid var(--line); border-radius:10px;
      background:var(--card); color:var(--fg); font:inherit; }
    .form-row { display:flex; align-items:center; gap:8px; }
    .counter { color:var(--mut); margin-right:auto; }
    button { min-height:48px; border:1px solid var(--line); border-radius:10px;
      background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
    .submit { border-color:var(--acc); background:var(--acc); color:white; font-weight:700; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .message { min-height:22px; margin:8px 0; color:var(--err); }
    .empty { color:var(--mut); }
    .ov { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
      padding:16px; background:rgba(0,0,0,.65); box-sizing:border-box; }
    .modal { width:100%; max-width:380px; padding:16px; box-sizing:border-box;
      border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .modal h2 { margin:0 0 8px; }
    .modal input { width:100%; box-sizing:border-box; padding:13px; border:1px solid var(--line);
      border-radius:10px; background:var(--bg); color:var(--fg); font:inherit; }
    .modal button { width:100%; margin-top:8px; border-color:var(--acc); background:var(--acc); color:var(--bg); font-weight:700; }
  </style>
</head>
<body>
  <main>
    <a class="start-link" href="index.html">← Startseite</a>
    <h1>Tagesmeme</h1>
    <img class="daily-meme" id="memeImage" alt="Tagesmeme">
    <div class="tabs" aria-label="Memebereich">
      <button id="browseTab" class="on" type="button">Gepostete Texte</button>
      <button id="addTab" type="button">Eigenen Text hinzufügen</button>
    </div>
    <section id="browseView" aria-label="Gepostete Texte">
      <div class="meme-grid" id="memeGrid"><p class="empty">Lade Beiträge …</p></div>
    </section>
    <section id="addView" class="hidden" aria-label="Eigenen Text hinzufügen">
      <div class="form">
        <label for="memeName">Dein Name</label>
        <input id="memeName" type="text" maxlength="20" autocomplete="name" placeholder="Name">
        <label for="memeText">Dein Satz zum Bild</label>
        <textarea id="memeText" maxlength="140" rows="3" placeholder="Dein Satz zum Bild …"></textarea>
        <div class="form-row">
          <span class="counter" id="counter">0 / 140</span>
          <button class="submit" id="submit" type="button">Absenden</button>
        </div>
        <p class="message" id="message" role="status"></p>
      </div>
    </section>
  </main>
  <script>
    const SB_URL="https://xbuofvrluzbzzedfohrd.supabase.co";
    const SB_KEY="sb_publishable_riutnJEMFYDNjgXde83gAA_N9QMtQEP";
    const API_HEADERS={apikey:SB_KEY,"Content-Type":"application/json"};
    const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const today=()=>new Date().toLocaleDateString("sv");
    let name="";
    try{name=localStorage.getItem("sdk_name")||""}catch(e){}
    let posting=false;

    async function memeApi(path,opt){
      const r=await fetch(SB_URL+"/rest/v1/"+path,{headers:API_HEADERS,...opt});
      if(!r.ok)throw new Error(r.status);
      return opt&&opt.method==="POST"?null:r.json();
    }

    async function initImage(){
      try{
        const response=await fetch("memes/memes.json",{cache:"no-store"});
        if(!response.ok)throw new Error();
        const images=await response.json();
        if(!Array.isArray(images)||!images.length)throw new Error();
        const [y,m,d]=today().split("-").map(Number);
        const epoch=Date.UTC(y,m-1,d);
        const days=Math.floor(epoch/86400000);
        const index=((days%images.length)+images.length)%images.length;
        document.getElementById("memeImage").src="memes/"+encodeURIComponent(images[index]);
      }catch(e){
        document.getElementById("memeImage").alt="Das Tagesbild konnte nicht geladen werden.";
      }
    }

    async function loadMemes(){
      const box=document.getElementById("memeGrid");
      box.innerHTML='<p class="empty">Lade Beiträge …</p>';
      try{
        const rows=await memeApi(`meme_comments?select=name,text,created_at&day=eq.${today()}&order=created_at.desc&limit=300`);
        if(!rows.length){box.innerHTML='<p class="empty">Noch keine Texte für das heutige Meme.</p>';return}
        box.innerHTML=rows.map(row=>{
          const date=new Date(row.created_at).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
          return `<article class="meme-card"><img class="meme-card-image" src="${esc(document.getElementById("memeImage").src)}" alt="Tagesmeme" loading="lazy"><div class="meme-card-text">${esc(row.text)}</div><footer><strong>${esc(row.name)}</strong><time>${esc(date)}</time></footer></article>`;
        }).join("");
      }catch(e){
        box.innerHTML='<p class="message">Die Beiträge können gerade nicht geladen werden. Bitte versuche es später erneut.</p>';
      }
    }
    document.getElementById("memeName").value=name;
    const memeText=document.getElementById("memeText");
    memeText.oninput=()=>{document.getElementById("counter").textContent=memeText.value.length+" / 140"};

    document.getElementById("browseTab").onclick=()=>{
      document.getElementById("browseTab").className="on";
      document.getElementById("addTab").className="";
      document.getElementById("browseView").classList.remove("hidden");
      document.getElementById("addView").classList.add("hidden");
      loadMemes();
    };
    document.getElementById("addTab").onclick=()=>{
      document.getElementById("browseTab").className="";
      document.getElementById("addTab").className="on";
      document.getElementById("browseView").classList.add("hidden");
      document.getElementById("addView").classList.remove("hidden");
    };

    document.getElementById("submit").onclick=async()=>{
      if(posting)return;
      const nameInput=document.getElementById("memeName");
      const text=memeText.value.trim();
      const poster=nameInput.value.trim();
      const message=document.getElementById("message");
      message.textContent="";
      if(!poster){message.textContent="Bitte gib deinen Namen ein.";return}
      if(poster.length>20){message.textContent="Der Name darf maximal 20 Zeichen lang sein.";return}
      if(!text){message.textContent="Bitte gib einen Satz ein.";return}
      if(text.length>140){message.textContent="Der Satz darf maximal 140 Zeichen lang sein.";return}
      let last=0;try{last=+(localStorage.getItem("meme_last_post")||0)}catch(e){}
      const remaining=30000-(Date.now()-last);
      if(remaining>0){message.textContent=`Bitte warte noch ${Math.ceil(remaining/1000)} Sekunden.`;return}
      posting=true;
      const button=document.getElementById("submit");button.disabled=true;
      try{
        await memeApi("meme_comments",{method:"POST",headers:{...API_HEADERS,Prefer:"return=minimal"},body:JSON.stringify({day:today(),name:poster.slice(0,20),text:text})});
        try{localStorage.setItem("meme_last_post",String(Date.now()))}catch(e){}
        name=poster;try{localStorage.setItem("sdk_name",poster)}catch(e){}
        memeText.value="";document.getElementById("counter").textContent="0 / 140";
        message.style.color="var(--acc)";
        message.textContent="Dein Text wurde veröffentlicht.";
        await loadMemes();
        document.getElementById("browseTab").click();
      }catch(e){
        message.style.color="var(--err)";
        message.textContent="Der Text konnte nicht gespeichert werden. Bitte versuche es später erneut.";
      }finally{
        posting=false;
        button.disabled=false;
      }
    };
    initImage().then(loadMemes);
  </script>
</body>
</html>
