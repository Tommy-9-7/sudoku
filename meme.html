<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tagesmeme</title>
  <style>
    :root {
      --bg:#fafaf7; --fg:#1d1d1b; --mut:#77756e; --line:#c9c6bb;
      --card:#fff; --acc:#1a5fd0; --soft:#edf2fa; --err:#d33;
      box-sizing:border-box;
    }
    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg:#171716; --fg:#ecece6; --mut:#9a988f; --line:#4a4944;
        --card:#232321; --acc:#7db0ff; --soft:#2a2d33; --err:#ff6b6b;
      }
    }
    :root[data-theme="dark"] {
      --bg:#171716; --fg:#ecece6; --mut:#9a988f; --line:#4a4944;
      --card:#232321; --acc:#7db0ff; --soft:#2a2d33; --err:#ff6b6b;
    }
    html,body { min-height:100%; }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
      padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    }
    main { max-width:820px; margin:0 auto; padding:16px; }
    .start-link { display:inline-block; margin-bottom:10px; color:var(--acc); text-decoration:none; font-weight:600; }
    h1 { font-size:24px; margin:8px 0 12px; }
    .meme { display:block; width:100%; max-height:520px; object-fit:contain;
      border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .form { margin:14px 0 18px; }
    textarea { width:100%; min-height:92px; resize:vertical; box-sizing:border-box;
      padding:12px; border:1px solid var(--line); border-radius:10px;
      background:var(--card); color:var(--fg); font:inherit; }
    .form-row { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .counter { color:var(--mut); margin-right:auto; }
    button { min-height:48px; border:1px solid var(--line); border-radius:10px;
      background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
    .submit { min-width:130px; border-color:var(--acc); background:var(--acc); color:var(--bg); font-weight:700; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .message { min-height:22px; margin:8px 0; color:var(--err); }
    .tabs { display:flex; gap:6px; margin:8px 0 10px; }
    .tabs button { flex:1; }
    .tabs button.on { border-color:var(--acc); background:var(--acc); color:var(--bg); }
    .comment { padding:10px 12px; border-bottom:1px solid var(--line); }
    .comment-head { display:flex; justify-content:space-between; gap:8px; color:var(--mut); font-size:14px; }
    .comment-head strong { color:var(--fg); }
    .comment-text { margin-top:5px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .empty { color:var(--mut); }
    .ov { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
      padding:16px; background:rgba(0,0,0,.65); box-sizing:border-box; }
    .modal { width:100%; max-width:380px; padding:16px; box-sizing:border-box;
      border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .modal h2 { margin:0 0 8px; }
    .modal input { width:100%; box-sizing:border-box; padding:13px; border:1px solid var(--line);
      border-radius:10px; background:var(--bg); color:var(--fg); font:inherit; }
    .modal button { width:100%; margin-top:8px; border-color:var(--acc); background:var(--acc); color:var(--bg); font-weight:700; }
  </style>
</head>
<body>
  <main>
    <a class="start-link" href="index.html">← Startseite</a>
    <h1>Tagesmeme</h1>
    <img class="meme" id="memeImage" alt="Tagesmeme">
    <div class="form">
      <textarea id="text" maxlength="140" rows="3" placeholder="Dein Satz zum Bild …"></textarea>
      <div class="form-row">
        <span class="counter" id="counter">0 / 140</span>
        <button class="submit" id="submit" type="button">Absenden</button>
      </div>
      <p class="message" id="message" role="status"></p>
    </div>
    <div class="tabs" aria-label="Zeitraum">
      <button id="todayTab" class="on" type="button">Heute</button>
      <button id="yesterdayTab" type="button">Gestern</button>
    </div>
    <section id="comments" aria-label="Beiträge"></section>
  </main>
  <script>
    const SB_URL="https://xbuofvrluzbzzedfohrd.supabase.co";
    const SB_KEY="sb_publishable_riutnJEMFYDNjgXde83gAA_N9QMtQEP";
    const H={apikey:SB_KEY,"Content-Type":"application/json"};
    const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const today=()=>new Date().toLocaleDateString("sv");
    let name="";
    try{name=localStorage.getItem("sdk_name")||""}catch(e){}
    let activeDay=today();
    let posting=false;

    function askName(){
      const ov=document.createElement("div");ov.className="ov";
      ov.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h2>Wie heißt du?</h2><input id="nm" maxlength="20" placeholder="Benutzername" autocomplete="off"><button id="saveName" type="button">Los geht’s</button></div>';
      document.body.appendChild(ov);
      const input=document.getElementById("nm");input.focus();
      function save(){
        const value=input.value.trim();
        if(!value)return;
        name=value;
        try{localStorage.setItem("sdk_name",value)}catch(e){}
        ov.remove();
      }
      document.getElementById("saveName").onclick=save;
      input.onkeydown=e=>{if(e.key==="Enter")save()};
    }

    function dayOffset(day,offset){
      const [y,m,d]=day.split("-").map(Number);
      const date=new Date(y,m-1,d);date.setDate(date.getDate()+offset);
      return date.toLocaleDateString("sv");
    }

    async function memeApi(path,opt){
      const r=await fetch(SB_URL+"/rest/v1/"+path,{headers:H,...opt});
      if(!r.ok)throw new Error(r.status);
      return opt&&opt.method==="POST"?null:r.json();
    }

    async function loadComments(){
      const box=document.getElementById("comments");
      box.innerHTML='<p class="empty">Lade Beiträge …</p>';
      try{
        const rows=await memeApi(`meme_comments?select=name,text,created_at&day=eq.${activeDay}&order=created_at.desc&limit=300`);
        if(!rows.length){box.innerHTML='<p class="empty">Noch keine Beiträge für diesen Tag.</p>';return}
        box.innerHTML=rows.map(row=>{
          const time=new Date(row.created_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
          return `<article class="comment"><div class="comment-head"><strong>${esc(row.name)}</strong><time>${esc(time)} Uhr</time></div><div class="comment-text">${esc(row.text)}</div></article>`;
        }).join("");
      }catch(e){
        box.innerHTML='<p class="message">Die Beiträge können gerade nicht geladen werden. Bitte versuche es später erneut.</p>';
      }
    }

    async function initImage(){
      try{
        const response=await fetch("memes/memes.json",{cache:"no-store"});
        if(!response.ok)throw new Error();
        const images=await response.json();
        if(!Array.isArray(images)||!images.length)throw new Error();
        const [y,m,d]=today().split("-").map(Number);
        const epoch=Date.UTC(y,m-1,d);
        const days=Math.floor(epoch/86400000);
        const index=((days%images.length)+images.length)%images.length;
        document.getElementById("memeImage").src="memes/"+encodeURIComponent(images[index]);
      }catch(e){
        document.getElementById("memeImage").alt="Das Tagesbild konnte nicht geladen werden.";
      }
    }

    const text=document.getElementById("text");
    const counter=document.getElementById("counter");
    text.oninput=()=>{counter.textContent=text.value.length+" / 140"};

    document.getElementById("submit").onclick=async()=>{
      if(posting)return;
      const value=text.value.trim();
      const message=document.getElementById("message");
      message.textContent="";
      if(!value){message.textContent="Bitte gib einen Satz ein.";return}
      if(value.length>140){message.textContent="Der Satz darf maximal 140 Zeichen lang sein.";return}
      if(!name){askName();return}
      let last=0;try{last=+(localStorage.getItem("meme_last_post")||0)}catch(e){}
      const remaining=30000-(Date.now()-last);
      if(remaining>0){message.textContent=`Bitte warte noch ${Math.ceil(remaining/1000)} Sekunden.`;return}
      posting=true;
      const button=document.getElementById("submit");button.disabled=true;
      try{
        await memeApi("meme_comments",{method:"POST",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify({day:today(),name:name.slice(0,20),text:value})});
        try{localStorage.setItem("meme_last_post",String(Date.now()))}catch(e){}
        text.value="";counter.textContent="0 / 140";
        message.textContent="Dein Beitrag wurde veröffentlicht.";
        await loadComments();
      }catch(e){
        message.textContent="Der Beitrag konnte nicht gespeichert werden. Bitte versuche es später erneut.";
      }finally{
        posting=false;
        setTimeout(()=>{button.disabled=false},800);
      }
    };

    document.getElementById("todayTab").onclick=()=>{
      activeDay=today();
      document.getElementById("todayTab").className="on";
      document.getElementById("yesterdayTab").className="";
      loadComments();
    };
    document.getElementById("yesterdayTab").onclick=()=>{
      activeDay=dayOffset(today(),-1);
      document.getElementById("todayTab").className="";
      document.getElementById("yesterdayTab").className="on";
      loadComments();
    };

    initImage();
    loadComments();
    if(!name)askName();
  </script>
</body>
</html>
