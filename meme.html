<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tagesmeme</title>
  <style>
    :root {
      --bg:#fafaf7; --fg:#1d1d1b; --mut:#77756e; --line:#c9c6bb;
      --card:#fff; --acc:#1a5fd0; --soft:#edf2fa; --err:#d33;
      box-sizing:border-box;
    }
    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg:#171716; --fg:#ecece6; --mut:#9a988f; --line:#4a4944;
        --card:#232321; --acc:#7db0ff; --soft:#2a2d33; --err:#ff6b6b;
      }
    }
    :root[data-theme="dark"] {
      --bg:#171716; --fg:#ecece6; --mut:#9a988f; --line:#4a4944;
      --card:#232321; --acc:#7db0ff; --soft:#2a2d33; --err:#ff6b6b;
    }
    html,body { min-height:100%; }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
      padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    }
    main { max-width:820px; margin:0 auto; padding:16px; }
    .start-link { display:inline-block; margin-bottom:10px; color:var(--acc); text-decoration:none; font-weight:600; }
    h1 { font-size:24px; margin:8px 0 12px; }
    .tabs { display:flex; gap:8px; margin:8px 0 16px; }
    .tabs button { flex:1; }
    .tabs button.on { border-color:var(--acc); background:var(--acc); color:white; }
    .hidden { display:none !important; }
    .meme-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    @media (max-width:520px) { .meme-grid { grid-template-columns:1fr; } }
    .meme-card { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .meme-card img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#ddd; }
    .meme-card footer { display:flex; justify-content:space-between; gap:8px; padding:10px 12px; }
    .meme-card strong { overflow:hidden; text-overflow:ellipsis; }
    .meme-card time { color:var(--mut); white-space:nowrap; }
    .form { display:grid; gap:10px; margin-top:4px; }
    .form label { font-weight:700; }
    .form input[type="text"] { width:100%; box-sizing:border-box; padding:13px;
      border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); font:inherit; }
    .form input[type="file"] { width:100%; box-sizing:border-box; padding:10px;
      border:1px dashed var(--line); border-radius:10px; background:var(--card); }
    button { min-height:48px; border:1px solid var(--line); border-radius:10px;
      background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
    .submit { border-color:var(--acc); background:var(--acc); color:white; font-weight:700; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .message { min-height:22px; margin:8px 0; color:var(--err); }
    .empty { color:var(--mut); }
    .ov { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
      padding:16px; background:rgba(0,0,0,.65); box-sizing:border-box; }
    .modal { width:100%; max-width:380px; padding:16px; box-sizing:border-box;
      border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .modal h2 { margin:0 0 8px; }
    .modal input { width:100%; box-sizing:border-box; padding:13px; border:1px solid var(--line);
      border-radius:10px; background:var(--bg); color:var(--fg); font:inherit; }
    .modal button { width:100%; margin-top:8px; border-color:var(--acc); background:var(--acc); color:var(--bg); font-weight:700; }
  </style>
</head>
<body>
  <main>
    <a class="start-link" href="index.html">← Startseite</a>
    <h1>Memes</h1>
    <div class="tabs" aria-label="Memebereich">
      <button id="browseTab" class="on" type="button">Gepostete Memes</button>
      <button id="addTab" type="button">Eigenes Meme hinzufügen</button>
    </div>
    <section id="browseView" aria-label="Gepostete Memes">
      <div class="meme-grid" id="memeGrid"><p class="empty">Lade Memes …</p></div>
    </section>
    <section id="addView" class="hidden" aria-label="Eigenes Meme hinzufügen">
      <div class="form">
        <label for="memeName">Dein Name</label>
        <input id="memeName" type="text" maxlength="20" autocomplete="name" placeholder="Name">
        <label for="memeFile">Meme-Bild</label>
        <input id="memeFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
        <button class="submit" id="submit" type="button">Meme veröffentlichen</button>
        <p class="message" id="message" role="status"></p>
      </div>
    </section>
  </main>
  <script>
    const SB_URL="https://xbuofvrluzbzzedfohrd.supabase.co";
    const SB_KEY="sb_publishable_riutnJEMFYDNjgXde83gAA_N9QMtQEP";
    const API_HEADERS={apikey:SB_KEY,"Content-Type":"application/json"};
    const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const today=()=>new Date().toLocaleDateString("sv");
    let name="";
    try{name=localStorage.getItem("sdk_name")||""}catch(e){}
    let posting=false;

    function askName(){
      const ov=document.createElement("div");ov.className="ov";
      ov.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h2>Wie heißt du?</h2><input id="nm" maxlength="20" placeholder="Benutzername" autocomplete="off"><button id="saveName" type="button">Los geht’s</button></div>';
      document.body.appendChild(ov);
      const input=document.getElementById("nm");input.focus();
      function save(){
        const value=input.value.trim();
        if(!value)return;
        name=value;
        try{localStorage.setItem("sdk_name",value)}catch(e){}
        ov.remove();
      }
      document.getElementById("saveName").onclick=save;
      input.onkeydown=e=>{if(e.key==="Enter")save()};
    }

    async function memeApi(path,opt){
      const r=await fetch(SB_URL+"/rest/v1/"+path,{headers:API_HEADERS,...opt});
      if(!r.ok)throw new Error(r.status);
      return opt&&opt.method==="POST"?null:r.json();
    }

    async function loadMemes(){
      const box=document.getElementById("memeGrid");
      box.innerHTML='<p class="empty">Lade Memes …</p>';
      try{
        const rows=await memeApi("meme_posts?select=name,image_url,created_at&order=created_at.desc&limit=300");
        if(!rows.length){box.innerHTML='<p class="empty">Noch keine Memes gepostet.</p>';return}
        box.innerHTML=rows.map(row=>{
          const date=new Date(row.created_at).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
          return `<article class="meme-card"><img src="${esc(row.image_url)}" alt="Von ${esc(row.name)} gepostetes Meme" loading="lazy"><footer><strong>${esc(row.name)}</strong><time>${esc(date)}</time></footer></article>`;
        }).join("");
      }catch(e){
        box.innerHTML='<p class="message">Die Beiträge können gerade nicht geladen werden. Bitte versuche es später erneut.</p>';
      }
    }
    document.getElementById("memeName").value=name;

    document.getElementById("browseTab").onclick=()=>{
      document.getElementById("browseTab").className="on";
      document.getElementById("addTab").className="";
      document.getElementById("browseView").classList.remove("hidden");
      document.getElementById("addView").classList.add("hidden");
      loadMemes();
    };
    document.getElementById("addTab").onclick=()=>{
      document.getElementById("browseTab").className="";
      document.getElementById("addTab").className="on";
      document.getElementById("browseView").classList.add("hidden");
      document.getElementById("addView").classList.remove("hidden");
    };

    document.getElementById("submit").onclick=async()=>{
      if(posting)return;
      const nameInput=document.getElementById("memeName");
      const fileInput=document.getElementById("memeFile");
      const poster=nameInput.value.trim();
      const file=fileInput.files&&fileInput.files[0];
      const message=document.getElementById("message");
      message.textContent="";
      if(!poster){message.textContent="Bitte gib deinen Namen ein.";return}
      if(poster.length>20){message.textContent="Der Name darf maximal 20 Zeichen lang sein.";return}
      if(!file){message.textContent="Bitte wähle ein Meme-Bild aus.";return}
      if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){message.textContent="Bitte nur JPG, PNG, WebP oder GIF verwenden.";return}
      if(file.size>5*1024*1024){message.textContent="Das Bild darf maximal 5 MB groß sein.";return}
      posting=true;
      const button=document.getElementById("submit");button.disabled=true;
      try{
        const extension=file.type==="image/jpeg"?"jpg":file.type==="image/png"?"png":file.type==="image/webp"?"webp":"gif";
        const randomId=crypto.randomUUID?crypto.randomUUID():String(Date.now())+"-"+Math.random().toString(36).slice(2);
        const objectName=randomId+"."+extension;
        const upload=await fetch(SB_URL+"/storage/v1/object/memes/"+encodeURIComponent(objectName),{
          method:"POST",headers:{apikey:SB_KEY,"Content-Type":file.type,"x-upsert":"false"},body:file
        });
        if(!upload.ok)throw new Error("upload");
        const imageUrl=SB_URL+"/storage/v1/object/public/memes/"+encodeURIComponent(objectName);
        await memeApi("meme_posts",{method:"POST",headers:{...API_HEADERS,Prefer:"return=minimal"},body:JSON.stringify({name:poster.slice(0,20),image_url:imageUrl})});
        name=poster;try{localStorage.setItem("sdk_name",poster)}catch(e){}
        fileInput.value="";
        message.style.color="var(--acc)";
        message.textContent="Dein Meme wurde veröffentlicht.";
        await loadMemes();
        document.getElementById("browseTab").click();
      }catch(e){
        message.style.color="var(--err)";
        message.textContent="Das Meme konnte nicht gespeichert werden. Bitte versuche es später erneut.";
      }finally{
        posting=false;
        button.disabled=false;
      }
    };
    loadMemes();
  </script>
</body>
</html>
